apiVersion: apps/v1
kind: Deployment
metadata:
  name: road-hazard-deployment
  labels:
    app: road-hazard-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: road-hazard-portal
  template:
    metadata:
      labels:
        app: road-hazard-portal
    spec:
      containers:
      - name: portal-container
        # Replace 'yourdockerhubusername' with your actual Docker Hub profile username
        image: yourdockerhubusername/road-hazard-portal:latest
        ports:
        - containerPort: 80
        imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: road-hazard-service
spec:
  type: NodePort
  selector:
    app: road-hazard-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
